<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ጂንካ ገበያ - ቱሪዝም፣ ሆቴሎች እና የመኪና ኪራይ</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- Header / Navigation Section -->
  <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <a href="index.html" class="text-2xl font-bold tracking-wide flex items-center gap-2">
        <span>🛍️ ጂንካ ገበያ</span>
      </a>
      <nav class="hidden md:flex gap-6 font-medium">
        <a href="index.html" class="hover:text-amber-300 transition">ዋና ገጽ</a>
        <a href="tourism.html" class="text-amber-300 border-b-2 border-amber-300 font-semibold">ቱሪዝም እና አገልግሎቶች</a>
        <a href="admin.html" class="hover:text-amber-300 transition">አድሚን</a>
      </nav>
      <a href="https://t.me/pikalopikalo4" target="_blank" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-4 py-2 rounded-lg transition text-sm flex items-center gap-2">
        <i class="fab font-bold fa-telegram"></i> አሁኑኑ ያስታውቁ
      </a>
    </div>
  </header>

  <!-- የፕሮሞሽን ስላይደር ቦታ (Promotion Slider Container) -->
  <div class="max-w-6xl mx-auto my-6 px-4">
    <div class="relative w-full overflow-hidden rounded-2xl shadow-lg bg-gray-900 h-48 md:h-72">
      
      <!-- ምስሎቹ የሚጫኑበት ቦታ -->
      <div id="sliderWrapper" class="flex transition-transform duration-500 ease-in-out h-full">
        <div class="w-full h-full flex items-center justify-center text-white text-sm">
          ስላይደሮች በመጫን ላይ ናቸው...
        </div>
      </div>

      <!-- ቀስቶች (Navigation Buttons) -->
      <button id="prevSlide" class="absolute left-3 top-1/2 -translate-y-1/2 bg-black/40 hover:bg-black/70 text-white p-2.5 rounded-full transition hidden">
        <i class="fas fa-chevron-left"></i>
      </button>
      <button id="nextSlide" class="absolute right-3 top-1/2 -translate-y-1/2 bg-black/40 hover:bg-black/70 text-white p-2.5 rounded-full transition hidden">
        <i class="fas fa-chevron-right"></i>
      </button>

      <!-- ነጥቦች (Indicators) -->
      <div id="sliderDots" class="absolute bottom-3 left-1/2 -translate-x-1/2 flex gap-2"></div>
    </div>
  </div>

  <!-- Main Directory Container -->
  <main class="max-w-7xl mx-auto px-4 py-12">

    <!-- Section Title -->
    <div class="flex justify-between items-end mb-8 border-b pb-4">
      <div>
        <h2 class="text-2xl font-bold text-gray-900">የተረጋገጡ አገልግሎት ሰጪዎች</h2>
        <p class="text-gray-500 text-sm">በአድሚን ተጎብኝተው የተረጋገጡ የአካባቢው ድርጅቶች እና ባለሙያዎች</p>
      </div>
      <span id="totalCount" class="text-sm font-semibold text-emerald-700">መረጃዎች በመጫን ላይ...</span>
    </div>

    <!-- DYNAMIC GRID LISTINGS CONTAINER (From Firebase) -->
    <div id="tourismContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <p class="text-gray-500 text-center col-span-full py-12 text-lg">
        <i class="fas fa-spinner fa-spin text-emerald-600 mr-2"></i> መረጃዎች ከ Firebase እየተጫኑ ነው...
      </p>
    </div>

  </main>

  <!-- Footer -->
  <footer class="bg-slate-900 text-gray-400 py-8 border-t border-slate-800 text-center text-sm">
    <div class="max-w-7xl mx-auto px-4">
      <p>© ጂንካ ገበያ (Jinka Market) - መብቱ በሕግ የተጠበቀ ነው።</p>
    </div>
  </footer>

  <!-- Firebase JavaScript SDK & Application Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCwAk45bie0KbuZtcp50zEkMkcY7RPwUp4",
      authDomain: "jinka-market-8231a.firebaseapp.com",
      projectId: "jinka-market-8231a",
      storageBucket: "jinka-market-8231a.firebasestorage.app",
      messagingSenderId: "711006866553",
      appId: "1:711006866553:web:cf709c47bf126f96ecd8a8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ==================== 1. PROMOTION SLIDER LOGIC ====================
    const sliderWrapper = document.getElementById('sliderWrapper');
    const sliderDots = document.getElementById('sliderDots');
    const prevBtn = document.getElementById('prevSlide');
    const nextBtn = document.getElementById('nextSlide');

    let currentIndex = 0;
    let totalSlides = 0;
    let slideInterval;

    const promoQuery = query(collection(db, "promotions"));

    onSnapshot(promoQuery, (snapshot) => {
      sliderWrapper.innerHTML = "";
      sliderDots.innerHTML = "";

      const activeDocs = snapshot.docs.filter(doc => doc.data().active !== false);

      if (activeDocs.length === 0) {
        sliderWrapper.innerHTML = `
          <div class="w-full h-full flex items-center justify-center text-gray-400 text-sm">
            ምንም የሚታይ ማስተዋወቂያ የለም።
          </div>`;
        prevBtn.classList.add('hidden');
        nextBtn.classList.add('hidden');
        return;
      }

      totalSlides = activeDocs.length;

      activeDocs.forEach((docSnap, index) => {
        const data = docSnap.data();

        const slide = document.createElement('a');
        slide.href = data.linkUrl || "#";
        slide.target = data.linkUrl && data.linkUrl !== "#" ? "_blank" : "_self";
        slide.className = "min-w-full h-full relative block flex-shrink-0";
        slide.innerHTML = `
          <img src="${data.imageUrl}" alt="${data.title}" class="w-full h-full object-cover">
          <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent flex items-end p-4 md:p-6">
            <div>
              <span class="bg-emerald-600 text-white text-[10px] font-bold uppercase px-2 py-0.5 rounded-full mb-1 inline-block">ልዩ ማስታወቂያ</span>
              <h3 class="text-white text-base md:text-xl font-bold">${data.title}</h3>
            </div>
          </div>
        `;
        sliderWrapper.appendChild(slide);

        const dot = document.createElement('button');
        dot.className = `w-2.5 h-2.5 rounded-full transition ${index === 0 ? 'bg-white w-6' : 'bg-white/50'}`;
        dot.addEventListener('click', () => goToSlide(index));
        sliderDots.appendChild(dot);
      });

      if (totalSlides > 1) {
        prevBtn.classList.remove('hidden');
        nextBtn.classList.remove('hidden');
        startAutoSlide();
      } else {
        prevBtn.classList.add('hidden');
        nextBtn.classList.add('hidden');
      }
    }, (error) => {
      console.error("Slider Fetch Error:", error);
      sliderWrapper.innerHTML = `<div class="w-full h-full flex items-center justify-center text-red-400 text-sm">ስላይደሩን መጫን አልተቻለም!</div>`;
    });

    function updateSlider() {
      sliderWrapper.style.transform = `translateX(-${currentIndex * 100}%)`;
      const dots = sliderDots.children;
      Array.from(dots).forEach((dot, idx) => {
        dot.className = idx === currentIndex ? "w-6 h-2.5 rounded-full bg-white transition" : "w-2.5 h-2.5 rounded-full bg-white/50 transition";
      });
    }

    function goToSlide(index) {
      currentIndex = index;
      updateSlider();
      startAutoSlide();
    }

    function nextSlide() {
      currentIndex = (currentIndex + 1) % totalSlides;
      updateSlider();
    }

    function prevSlide() {
      currentIndex = (currentIndex - 1 + totalSlides) % totalSlides;
      updateSlider();
    }

    function startAutoSlide() {
      clearInterval(slideInterval);
      slideInterval = setInterval(nextSlide, 4000);
    }

    nextBtn.addEventListener('click', () => { nextSlide(); startAutoSlide(); });
    prevBtn.addEventListener('click', () => { prevSlide(); startAutoSlide(); });


    // ==================== 2. TOURISM DATA FETCH LOGIC ====================
    const tourismContainer = document.getElementById('tourismContainer');
    const totalCount = document.getElementById('totalCount');

    const tourismQuery = query(collection(db, "tourism_products"));

    onSnapshot(tourismQuery, (snapshot) => {
      tourismContainer.innerHTML = "";

      if (snapshot.empty) {
        tourismContainer.innerHTML = `
          <p class="text-gray-500 text-center col-span-full py-12 text-lg">
            ምንም የተመዘገበ የቱሪዝም ወይም የሆቴል መረጃ አልተገኘም።
          </p>`;
        totalCount.textContent = "ጠቅላላ፦ 0";
        return;
      }

      totalCount.textContent = `ጠቅላላ፦ ${snapshot.docs.length}`;

      snapshot.forEach((docSnap) => {
        const item = docSnap.data();

        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl shadow-md overflow-hidden border border-gray-100 hover:shadow-xl transition flex flex-col justify-between";
        card.innerHTML = `
          <div>
            <div class="relative h-48 bg-gray-200">
              <img src="${item.imageUrl || 'https://via.placeholder.com/400x200'}" alt="${item.title || item.providerName}" class="w-full h-full object-cover">
              <span class="absolute top-3 right-3 bg-emerald-600 text-white text-xs font-bold px-2.5 py-1 rounded-full shadow">
                ${item.category || 'ቱሪዝም'}
              </span>
            </div>
            <div class="p-5">
              <h3 class="text-xl font-bold text-gray-900 mb-1">${item.title || item.providerName}</h3>
              <p class="text-xs text-gray-500 mb-3 flex items-center gap-1">
                <i class="fas fa-map-marker-alt text-red-500"></i> ${item.location || 'ጂንካ'}
              </p>
              <div class="text-emerald-700 font-bold text-lg mb-4">
                ${item.price ? item.price + ' ETB' : 'ዋጋ አልተጠቀሰም'}
              </div>
            </div>
          </div>
          
          <div class="p-5 pt-0 border-t border-gray-50 mt-auto flex items-center justify-between gap-2 pt-3">
            ${item.phone ? `<a href="tel:${item.phone}" class="flex-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-bold py-2 rounded-lg text-center transition flex items-center justify-center gap-1"><i class="fas fa-phone"></i> ደውል</a>` : ''}
            ${item.telegram ? `<a href="${item.telegram}" target="_blank" class="flex-1 bg-sky-50 hover:bg-sky-100 text-sky-600 text-xs font-bold py-2 rounded-lg text-center transition flex items-center justify-center gap-1"><i class="fab fa-telegram-plane"></i> ቴሌግራም</a>` : ''}
            ${item.whatsapp ? `<a href="${item.whatsapp}" target="_blank" class="flex-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-600 text-xs font-bold py-2 rounded-lg text-center transition flex items-center justify-center gap-1"><i class="fab fa-whatsapp"></i> WhatsApp</a>` : ''}
          </div>
        `;
        tourismContainer.appendChild(card);
      });
    }, (error) => {
      console.error("Tourism Fetch Error:", error);
      tourismContainer.innerHTML = `
        <p class="text-red-500 text-center col-span-full py-12 text-lg">
          መረጃዎችን መጫን አልተቻለም! እባክዎን የኢንተርኔት ግንኙነትዎን ወይም የ Firebase ህግጋትን ያረጋግጡ።
        </p>`;
    });

  </script>
</body>
</html>
